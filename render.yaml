services:
  - type: web
    name: quant-path-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_SETUP_CODE
        sync: false
      - key: CORS_ORIGINS
        sync: false
